services:
  postgres:
    image: postgres:16
    container_name: roadmates-postgres
    environment:
      POSTGRES_DB: paiementdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - roadmates-postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: roadmates-mongo
    ports:
      - "27017:27017"
    volumes:
      - roadmates-mongo-data:/data/db

volumes:
  roadmates-postgres-data:
  roadmates-mongo-data:
