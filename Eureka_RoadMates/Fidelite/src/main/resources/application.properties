spring.application.name=Fidelite
server.port=8085

#PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/fidelitedb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://peer1:8761/eureka/,http://peer2:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Microservice Fidelite
info.app.version=1.0.0
