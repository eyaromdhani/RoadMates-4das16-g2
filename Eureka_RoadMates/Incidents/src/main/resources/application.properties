spring.application.name=Incidents
server.port=8086

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/incidentsdb

# Eureka
eureka.client.service-url.defaultZone=http://peer1:8761/eureka/,http://peer2:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Microservice Incidents
info.app.version=1.0.0