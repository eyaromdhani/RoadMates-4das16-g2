spring.application.name=paiement
server.port=8083

#PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/paiementdb
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Microservice Paiement
info.app.version=1.0.0